name: auto-release

on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write

jobs:
  auto-release:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-auto-release.yml@3e8ffeb9c11a5b7d61f8a33ec27a9ca5ca3180e3 # 0.58.2
    with:
      release-workflow: release.yml
    secrets:
      token: ${{ secrets.REPO_ACCESS_TOKEN }}
