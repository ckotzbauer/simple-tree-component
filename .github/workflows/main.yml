name: build

on:
  push:
    branches:
      - '**'
  pull_request: {}

permissions:
  actions: read
  contents: read

jobs:
  build:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@f5a14d385a1f71e8120fd6568b8a85df921b6db3 # 0.58.3
    with:
      install-node: true
      build-commands: |
        npm ci
        npm run build
      test-commands: npm test
      report-coverage: true
      coverage-file: ./coverage/lcov.info

  docs:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@f5a14d385a1f71e8120fd6568b8a85df921b6db3 # 0.58.3
    with:
      install-node: true
      build-commands: |
        npm ci
        npm run build:docs

  lint:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@f5a14d385a1f71e8120fd6568b8a85df921b6db3 # 0.58.3
    with:
      install-node: true
      lint-commands: |
        npm ci
        npm run lint