name: build

on:
  push:
    branches:
      - '**'
  pull_request: {}

permissions:
  actions: read
  contents: read

jobs:
  build:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@70492262e47019908260a22d989ea8c55c549cdb # 0.58.1
    with:
      install-node: true
      build-commands: |
        npm ci
        npm run build
      test-commands: npm test
      report-coverage: true
      coverage-file: ./coverage/lcov.info

  docs:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@70492262e47019908260a22d989ea8c55c549cdb # 0.58.1
    with:
      install-node: true
      build-commands: |
        npm ci
        npm run build:docs

  lint:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@70492262e47019908260a22d989ea8c55c549cdb # 0.58.1
    with:
      install-node: true
      lint-commands: |
        npm ci
        npm run lint