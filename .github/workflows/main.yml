name: build

on:
  push:
    branches:
      - '**'
  pull_request: {}

permissions:
  actions: read
  contents: read

jobs:
  build:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@3e8ffeb9c11a5b7d61f8a33ec27a9ca5ca3180e3 # 0.58.2
    with:
      install-node: true
      build-commands: |
        npm ci
        npm run build
      test-commands: npm test
      report-coverage: true
      coverage-file: ./coverage/lcov.info

  docs:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@3e8ffeb9c11a5b7d61f8a33ec27a9ca5ca3180e3 # 0.58.2
    with:
      install-node: true
      build-commands: |
        npm ci
        npm run build:docs

  lint:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@3e8ffeb9c11a5b7d61f8a33ec27a9ca5ca3180e3 # 0.58.2
    with:
      install-node: true
      lint-commands: |
        npm ci
        npm run lint