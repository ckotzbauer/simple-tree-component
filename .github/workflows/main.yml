name: build

on:
  push:
    branches:
      - '**'
  pull_request: {}

permissions:
  actions: read
  contents: read

jobs:
  build:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@e01cb893cb20b3cc9796e6b2d777491734ef774f # 0.58.0
    with:
      install-node: true
      build-commands: |
        npm ci
        npm run build
      test-commands: npm test
      report-coverage: true
      coverage-file: ./coverage/lcov.info

  docs:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@e01cb893cb20b3cc9796e6b2d777491734ef774f # 0.58.0
    with:
      install-node: true
      build-commands: |
        npm ci
        npm run build:docs

  lint:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@e01cb893cb20b3cc9796e6b2d777491734ef774f # 0.58.0
    with:
      install-node: true
      lint-commands: |
        npm ci
        npm run lint