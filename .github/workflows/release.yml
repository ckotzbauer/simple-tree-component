name: create-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-release-nodejs.yml@fd699521fc995525d339964a82f6f781581bf471 # 0.57.0
    with:
      version: ${{ github.event.inputs.version }}
      build-commands: |
        npm ci
        npm run build
        npm run build:docs
        npm test
      artifact-path: dist/
      npm: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      pat: ${{ secrets.REPO_ACCESS_TOKEN }}
      npm-token: ${{ secrets.NPM_TOKEN }}

  deploy-docs:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy docs
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3
        with:
          workflow: deploy-docs
          ref: main
          token: ${{ secrets.REPO_ACCESS_TOKEN }}